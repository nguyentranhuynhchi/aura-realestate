version: '3.8'

services:
# 1
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./pipelines:/app/pipelines  
    environment:
      - VLLM_HOST=http://vllm:8000/v1
      - VLLM_API_KEY=vllm-local
      - VLLM_MODEL_NAME=Qwen/Qwen2.5-3B-Instruct-AWQ
      - VLLM_BASE_URL=http://vllm:8000/v1
    env_file:
      - ./backend/.env
# 2
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
# 3
  chromadb:
    image: chromadb/chroma:0.4.24
    ports:
      - "8001:8000"
    volumes:
      # Ánh xạ chuẩn vào thư mục /data mà Agent vừa tìm ra
      - ./docker_data/chromadb_data:/data
    environment:
      - IS_PERSISTENT=TRUE
      - PERSISTENT_DIR=/data
      - ANONYMIZED_TELEMETRY=FALSE
# 4  
  postgres:
    image: postgres:15-alpine
    container_name: aura_postgres
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - ./docker_data/postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=aura_realestate_db
# chỉ là khuân mẫu      
  airflow-common: &airflow-common
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://postgres:postgres@postgres:5432/airflow_db
      - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW_FERNET_KEY}
      - AIRFLOW__WEBSERVER__SECRET_KEY=${AIRFLOW_WEBSERVER_SECRET_KEY}
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=True
      - PYTHONPATH=/app
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      # --- CẤU HÌNH GỬI GMAIL ALERT ---
      - AIRFLOW__SMTP__SMTP_HOST=smtp.gmail.com
      - AIRFLOW__SMTP__SMTP_STARTTLS=True
      - AIRFLOW__SMTP__SMTP_SSL=False
      - AIRFLOW__SMTP__SMTP_USER=${AIRFLOW_SMTP_USER}
      - AIRFLOW__SMTP__SMTP_PASSWORD=${AIRFLOW_SMTP_PASSWORD}
      - AIRFLOW__SMTP__SMTP_PORT=587
      - AIRFLOW__SMTP__SMTP_MAIL_FROM=${AIRFLOW_SMTP_MAIL_FROM}
    volumes:
      - ./dags:/opt/airflow/dags
      - ./pipelines:/app/pipelines
      - ./crawler:/app/crawler
      - ./data:/app/data
      - ./backend/models:/app/backend/models
      - ./model_registry:/app/model_registry
      - ./pipeline_log.json:/app/pipeline_log.json
    depends_on:
      - postgres
      - chromadb
# 5
  airflow-webserver:
    <<: *airflow-common
    container_name: aura_airflow_webserver
    command: airflow webserver
    ports:
      - "8080:8080"
    restart: always
# 6 
  airflow-scheduler:
    <<: *airflow-common
    container_name: aura_airflow_scheduler
    command: airflow scheduler
    restart: always
# 7
  vllm:
    image: vllm/vllm-openai:v0.6.3.post1
    container_name: aura_vllm_server
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    ports:
      - "8002:8000"
    ipc: host
    command: >
      --model Qwen/Qwen2.5-3B-Instruct-AWQ
      --quantization awq_marlin
      --dtype half
      --max-model-len 2048 
      --gpu-memory-utilization 0.90
      --swap-space 2
      --enforce-eager
      --host 0.0.0.0
      --port 8000 
    restart: unless-stopped
# --max-model-len 2048 # ◄ ĐÂY LÀ TRẦN TỐI ĐA (Nếu vượt quá, vLLM từ chối ngay)
# 8  
  prometheus:
    image: prom/prometheus:latest
    container_name: aura_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    entrypoint:
      - /bin/sh
      - -c
      - |
        cat <<EOF > /etc/prometheus/prometheus.yml
        global:
          scrape_interval: 2s
          evaluation_interval: 2s
        scrape_configs:
          - job_name: "vllm"
            static_configs:
              - targets: ["vllm:8000"]
        EOF
        /bin/prometheus --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/prometheus
# 9
  grafana:
    image: grafana/grafana:latest
    container_name: aura_grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false